name: CopySpeed

options:
  bundleIdPrefix: com.roman
  deploymentTarget:
    macOS: "14.0"

targets:
  CopySpeed:
    type: application
    platform: macOS
    sources:
      - path: CopySpeed
    settings:
      base:
        PRODUCT_NAME: CopySpeed
        PRODUCT_BUNDLE_IDENTIFIER: com.roman.copyspeed
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2M4LLPLRLS
        ENABLE_HARDENED_RUNTIME: YES
        # Keine Sandbox: Accessibility-Zugriff auf den Finder ist sonst nicht möglich.
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: CopySpeed
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Roman Hohenberg"
    scheme:
      testTargets:
        - CopySpeedTests

  CopySpeedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CopySpeedTests
    dependencies:
      - target: CopySpeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roman.copyspeed.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 2M4LLPLRLS
